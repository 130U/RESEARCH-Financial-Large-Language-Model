name: Reproduce

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyTorch for the CPU and the other dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "tokenizers>=0.21,<0.24" "scikit-learn>=1.5,<2" "pytest>=8,<10"
      - name: Run the tests
        run: python -m pytest -q
      - name: Recompute every figure in the article
        run: python reproduce/run_all.py
